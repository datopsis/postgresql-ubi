name: Propose artifact lock update

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      propose:
        description: Open an update PR (main only); false retains candidates only
        type: boolean
        default: true

concurrency:
  group: update-locks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bases:
    name: resolve UBI manifest indexes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh selected UBI release and verify both platforms
        run: python scripts/refresh-bases.py

      - name: Share the same pinned bases with both native resolvers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-input-candidate
          path: |
            Containerfile
            artifacts/lock-inputs.json
          if-no-files-found: error
          retention-days: 7

  resolve:
    needs: bases
    name: resolve candidate (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the common base selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-input-candidate

      - name: Validate candidate lock inputs
        run: python scripts/artifacts.py validate-inputs artifacts/lock-inputs.json

      - name: Acquire PostgreSQL seeds and approved keys
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          python scripts/artifacts.py acquire-inputs
          --inputs artifacts/lock-inputs.json
          --architecture "${ARCHITECTURE}"
          --output resolution-inputs

      - name: Resolve and inspect the complete RPM closure
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          UBI_MINIMAL="$(python -c 'import json; print(json.load(open("artifacts/lock-inputs.json"))["base_images"]["builder"])')"
          docker run --rm --platform "${PLATFORM}" \
            --volume "${PWD}:/work" --workdir /work \
            "${UBI_MINIMAL}" bash scripts/resolve-lock.sh \
            "${ARCHITECTURE}" /work/resolution-inputs /work/resolution-output

      - name: Render and validate candidate lock
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python scripts/render-lock.py \
            --inputs artifacts/lock-inputs.json \
            --architecture "${ARCHITECTURE}" \
            --binary-inventory resolution-output/binary-inventory.tsv \
            --source-inventory resolution-output/source-inventory.tsv \
            --output "artifacts/locks/${ARCHITECTURE}.json"
          python scripts/artifacts.py validate-lock "artifacts/locks/${ARCHITECTURE}.json"

      - name: Retain candidate for maintainer review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-lock-candidate-${{ matrix.architecture }}
          path: artifacts/locks/${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain resolver inventories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolution-inventories-${{ matrix.architecture }}
          path: resolution-output/*-inventory.tsv
          if-no-files-found: error
          retention-days: 7

  propose:
    name: propose reviewed-input changes
    needs: [bases, resolve]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.propose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download base candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: base-input-candidate

      - name: Download both native locks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifact-lock-candidate-*
          path: artifacts/locks
          merge-multiple: true

      - name: Validate and open a pull request when inputs changed
        env:
          GH_TOKEN: ${{ secrets.LOCK_UPDATE_TOKEN || github.token }}
        run: bash scripts/propose-lock-update.sh
